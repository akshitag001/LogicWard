name: CI

on:
  push:
    branches: [main, master, portfolio-upgrade]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Measure coverage inside the subprocesses each smoke suite spawns.
      COVERAGE_PROCESS_START: pyproject.toml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check logicward tests

      - name: Pytest (every smoke suite, isolated subprocesses)
        run: pytest -q

      - name: Doctests (module examples)
        run: pytest --doctest-modules logicward/engine -q

      - name: Coverage report
        if: always()
        shell: bash
        run: |
          coverage combine || true
          coverage report || true
          coverage xml || true
          {
            echo '### Coverage — ${{ matrix.os }} py${{ matrix.python-version }}'
            echo '```'
            coverage report 2>/dev/null | tail -n 25 || echo "no coverage data"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
