[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logicward"
version = "1.0.0"
description = "Detect unauthorized PLC logic changes before they become physical incidents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MUDIT" }]
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "lxml>=5.0",
    "watchdog>=4.0",
    "reportlab>=4.0",
    "psutil>=5.9",
    "cryptography>=42.0",
    "defusedxml>=0.7",
    "werkzeug>=3.0",
]

[project.optional-dependencies]
# Real Raspberry Pi edge-hardware sensors (all have simulation fallbacks).
pi = ["scapy>=2.5", "gpiozero>=2.0"]
# Production WSGI server (works on Windows via waitress).
prod = ["waitress>=3.0"]
# Development + CI.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "playwright>=1.44",
    "pdf2image>=1.17",
    "pillow>=10.0",
    "pygments>=2.17",
]

[project.scripts]
logicward = "logicward.__main__:main"

[tool.setuptools.packages.find]
include = ["logicward*"]

[tool.setuptools.package-data]
"logicward" = [
    "dashboard/templates/*.html", "dashboard/static/*", "dashboard/static/**/*",
    "plant/program/*.L5X", "plant/program/*.json",
    "sites/grfics/templates/*.html", "sites/grfics/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["logicward"]
parallel = true          # each smoke suite runs in its own subprocess
omit = ["logicward/tests/*", "logicward/agent/sensors/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["deploy", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # long lines (tables/URLs); not worth churning
    "E741",   # ambiguous var name l/I — used in diff code for left/right
    "E702",   # compact semicolon statements in the standalone smoke scripts
]
